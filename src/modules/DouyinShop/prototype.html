<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5c411b"><title>CROCS童鞋官方旗舰店 · UI预览</title><link rel="stylesheet" href="/shop-ui/style.css"><link rel="stylesheet" href="/shop-ui/header-motion.css"><link rel="stylesheet" href="/shop-ui/source-style.css"><link rel="stylesheet" href="/shop-ui/ios-refinement.css"><meta name="description" content="独立的 CROCS 童鞋店铺 UI 交互参考原型。"></head><body>
<main class="store" id="store">
<header class="store-header" id="storeHeader">
<div class="cover"></div><div class="cover-shade"></div><div class="toolbar-shade" aria-hidden="true"></div>
<div class="toolbar"><button class="icon-button back" aria-label="返回" data-action="back"><img src="/shop-ui/assets/back.png" alt=""></button><button class="mini-brand" aria-label="店铺信息" data-action="store-info" tabindex="-1" aria-hidden="true"><span class="mini-logo"><img src="/shop-ui/assets/wordmark.png" alt=""><span class="mini-plus">+</span></span><span class="mini-info"><strong>CROCS童鞋官方旗舰店</strong><img src="/shop-ui/assets/flagship-badge.png" alt="抖音旗舰"></span></button><button class="search" data-action="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg><span>鞋花</span></button><button class="icon-button share" data-action="share" aria-label="分享"><img src="/shop-ui/assets/share.png" alt=""></button></div>
<div class="header-details">
<img class="wordmark" src="/shop-ui/assets/wordmark.png" alt="crocs">
<div class="name-row"><button class="store-name" data-action="store-info"><span class="store-name-latin">CROCS</span> 童鞋官方旗舰店</button><button class="follow" id="follow" aria-pressed="false"><span class="gift-label">领券</span><span class="follow-label"><svg class="follow-plus" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10"/></svg><span>关注</span></span></button></div>
<button class="reputation" data-action="reputation"><img class="stars" src="/shop-ui/assets/stars.png" alt="评分"><span class="score">4.7</span><span class="fans">粉丝10.3万</span><span class="tag-scroll"><span class="tag-track"><span class="rank-tag"><img src="/shop-ui/assets/reputation-ranking.png" alt="店铺榜">入选品牌儿童鞋靴榜<img class="rank-chevron" src="/shop-ui/assets/reputation-chevron.png" alt=""></span><span class="small-tag"><img src="/shop-ui/assets/customers.png" alt="">近半年5万回头客</span><span class="small-tag"><img src="/shop-ui/assets/thumb.png" alt="">近半年1千好评</span><span class="small-tag"><img src="/shop-ui/assets/reputation-sales.png" alt="">销量14.7万</span><span class="small-tag"><img src="/shop-ui/assets/reputation-cart.png" alt="">近30天加购超1万件商品</span><span class="small-tag"><img src="/shop-ui/assets/reputation-search.png" alt="">近半年82万人搜过</span></span></span></button>
<div class="benefit-cards"><button class="benefit live-card" data-action="live"><div class="live-preview"><video src="/shop-ui/assets/live-reference.mp4" poster="/shop-ui/assets/live.png" autoplay muted loop playsinline disablepictureinpicture aria-label="参考视频中的直播封面录像"></video></div><span class="benefit-copy"><strong><img class="live-waveform" src="/shop-ui/assets/live-waveform.webp" alt="">直播中</strong><small>49件热卖商品<span class="chevron">›</span></small></span></button><button class="benefit member-card" data-action="member"><span class="member-icon"><img src="/shop-ui/assets/member.png" alt=""><span>10<small>元</small></span></span><span class="benefit-copy"><strong>入会领10元</strong><small>尊享会员身份<span class="chevron">›</span></small></span></button></div>
</div>
<button class="official-banner" data-action="certification"><img class="certification-art" src="/shop-ui/assets/certification.png" alt="抖音旗舰｜抖音商城官方认证 品牌旗舰"></button>
</header>
<div class="shop-body" id="shopBody"><nav class="tabs" role="tablist" aria-label="店铺栏目"><button role="tab" id="tab-brand" aria-selected="true" aria-controls="panel-brand" data-tab="brand">品牌</button><button role="tab" id="tab-products" aria-selected="false" aria-controls="panel-products" data-tab="products">商品</button><button role="tab" id="tab-category" aria-selected="false" aria-controls="panel-category" data-tab="category">分类</button><button role="tab" id="tab-new" aria-selected="false" aria-controls="panel-new" data-tab="new">新品</button><span class="tab-indicator" aria-hidden="true"></span></nav>
<section id="panel-brand" role="tabpanel" aria-labelledby="tab-brand" class="panel"><!--V2_BRAND_CONTENT--></section>
<section id="panel-products" role="tabpanel" aria-labelledby="tab-products" class="panel" hidden><div class="sortbar"><button class="active" data-sort="default">综合</button><button data-sort="sales">销量</button><button data-sort="new">上新</button><button data-sort="price">价格 <span>↕</span></button></div><div class="product-grid" id="products"></div></section>
<section id="panel-category" role="tabpanel" aria-labelledby="tab-category" class="panel" hidden><div class="category-layout"><aside class="category-nav"><button class="active" data-category="all">全部商品</button><button data-category="warm">暖棉系列</button><button data-category="classic">经典洞洞鞋</button><button data-category="collab">联名系列</button><button data-category="jibbitz">个性鞋花</button></aside><div class="category-results"><h2 id="categoryTitle">全部商品</h2><div class="product-grid" id="categories"></div></div></div></section>
<section id="panel-new" role="tabpanel" aria-labelledby="tab-new" class="panel" hidden><div class="new-heading"><span>NEW ARRIVALS</span><h2>新潮新品 · 自在上新</h2></div><div class="product-grid" id="newProducts"></div></section></div>
</main>
<script src="/shop-ui/source-contract.js"></script><script src="/shop-ui/app.js"></script><script src="/shop-ui/ios-interactions.js"></script></body></html>
